[project]
name = "s3-hidbot-host"
version = "0.2.0"
description = "Pure host-side s3-hidbot UART control-plane core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]
keywords = ["esp32", "hid", "uart", "usb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
flash = ["esptool>=4.12,<5"]

[project.urls]
Homepage = "https://github.com/w-dee/s3-hidbot"
Repository = "https://github.com/w-dee/s3-hidbot"
Issues = "https://github.com/w-dee/s3-hidbot/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hidbotctl = "hidbot.cli:main"

[tool.s3-hidbot]
scope = "UART session, exposure, pairing, bond administration, route, HID, and verified firmware operations"
