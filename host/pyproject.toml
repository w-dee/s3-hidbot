[project]
name = "s3-hidbot-host"
version = "0.1.0"
description = "Pure host-side s3-hidbot UART control-plane core"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hidbotctl = "hidbot.cli:main"

[tool.s3-hidbot]
scope = "U4.4 host serial transport, safety-only hid.release_all, absolute hid.keyboard.report, and relative hid.mouse.report APIs"
