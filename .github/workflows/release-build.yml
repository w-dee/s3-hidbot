name: Release build

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character commit SHA to build as a pre-tag candidate
        required: true
        type: string
      expected_tag:
        description: Optional existing annotated vX.Y.Z tag to recover at expected_commit
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ESP_IDF_CONTAINER_IMAGE: &esp_idf_container_image espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build immutable release candidate assets
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      product-version: ${{ steps.contract.outputs.product-version }}
      firmware-name: ${{ steps.contract.outputs.firmware-name }}
      wheel-name: ${{ steps.contract.outputs.wheel-name }}
      sdist-name: ${{ steps.contract.outputs.sdist-name }}
    container:
      image: *esp_idf_container_image
    steps:
      - name: Select exact immutable checkout ref and release mode
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_COMMIT: ${{ inputs.expected_commit }}
          INPUT_TAG: ${{ inputs.expected_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s' "$INPUT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
            if [[ -z "$INPUT_TAG" ]]; then
              mode="candidate"
              checkout_ref="$INPUT_COMMIT"
            else
              printf '%s' "$INPUT_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
              mode="existing-tag-recovery"
              checkout_ref="refs/tags/$INPUT_TAG"
            fi
          else
            mode="tag-push"
            checkout_ref="$EVENT_REF"
          fi
          {
            printf 'mode=%s\n' "$mode"
            printf 'checkout_ref=%s\n' "$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout selected immutable revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.select.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Resolve exact candidate or annotated tag commit
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
          RELEASE_MODE: ${{ steps.select.outputs.mode }}
          INPUT_COMMIT: ${{ inputs.expected_commit }}
          INPUT_TAG: ${{ inputs.expected_tag }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == "candidate" ]]; then
            expected_sha="$INPUT_COMMIT"
            printf '%s' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'
          else
            if [[ "$RELEASE_MODE" == "existing-tag-recovery" ]]; then
              release_tag="$INPUT_TAG"
            else
              release_tag="$TAG_NAME"
            fi
            if ! python3 tools/release_contract.py \
                --source-root "$GITHUB_WORKSPACE" \
                --repository "$GITHUB_WORKSPACE" \
                --tag "$release_tag" >"$RUNNER_TEMP/release-contract.json"; then
              sed -n '1,20p' "$RUNNER_TEMP/release-contract.json" >&2
              exit 1
            fi
            expected_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_revision"])' "$RUNNER_TEMP/release-contract.json")
            if [[ "$RELEASE_MODE" == "existing-tag-recovery" ]]; then
              test "$expected_sha" = "$INPUT_COMMIT"
            fi
          fi
          actual_sha=$(git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$actual_sha" = "$expected_sha"
          source_date_epoch=$(git -c "safe.directory=$GITHUB_WORKSPACE" show -s --format=%ct "$expected_sha")
          test "$source_date_epoch" -ge 0
          {
            printf 'S3_HIDBOT_SOURCE_REVISION=%s\n' "$expected_sha"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
          } >> "$GITHUB_ENV"

      - name: Enforce release version authority and static guards
        id: contract
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: |
          set -euo pipefail
          contract=$(python3 tools/release_contract.py --source-root "$GITHUB_WORKSPACE")
          python3 -c 'import json,sys; json.load(sys.stdin)' <<<"$contract"
          {
            python3 -c 'import json,sys; value=json.load(sys.stdin); print("product-version=" + value["version"]); print("firmware-name=" + value["firmware_archive"]); print("wheel-name=" + value["host_wheel"]); print("sdist-name=" + value["host_sdist"])' <<<"$contract"
          } >> "$GITHUB_OUTPUT"
          ./tools/test-static.sh
          python3 tools/test_privacy_lint.py
          python3 tools/privacy_lint.py --tracked

      - name: Build and compare two independent firmware archives
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"
          artifact_root="$RUNNER_TEMP/s3-hidbot-release-build"
          mkdir -p "$artifact_root/a" "$artifact_root/b" "$artifact_root/release-assets"
          printf 'RELEASE_BUILD_DIR=%s\n' "$artifact_root" >> "$GITHUB_ENV"
          artifact_name="${{ steps.contract.outputs.firmware-name }}"

          build_one() {
            local output="$1"
            python3 tools/build_firmware_artifact.py \
              --output "$output" \
              --source-root "$GITHUB_WORKSPACE" \
              --source-revision "$S3_HIDBOT_SOURCE_REVISION" \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --container-image "$ESP_IDF_CONTAINER_IMAGE"
          }

          build_one "$artifact_root/a/$artifact_name"
          build_one "$artifact_root/b/$artifact_name"
          python3 tools/compare_release_firmware.py \
            "$artifact_root/a/$artifact_name" "$artifact_root/b/$artifact_name"
          python3 -m pip install --disable-pip-version-check --no-input build
          python3 tools/prepare_release_assets.py \
            --output "$artifact_root/release-assets" \
            --firmware-artifact "$artifact_root/a/$artifact_name" \
            --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$S3_HIDBOT_SOURCE_REVISION"
          python3 tools/verify_release_assets.py \
            "$artifact_root/release-assets" \
            --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$S3_HIDBOT_SOURCE_REVISION"

      - name: Upload one exact temporary release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: ${{ env.RELEASE_BUILD_DIR }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release build workspace
        if: always()
        run: |
          if [[ -n "${RELEASE_BUILD_DIR:-}" ]]; then
            rm -rf -- "$RELEASE_BUILD_DIR"
          fi

  consume:
    name: Checkout-free release asset consumer (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_VERSION: ${{ needs.build.outputs.product-version }}
      FIRMWARE_NAME: ${{ needs.build.outputs.firmware-name }}
      WHEEL_NAME: ${{ needs.build.outputs.wheel-name }}
      SDIST_NAME: ${{ needs.build.outputs.sdist-name }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up consumer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact release assets without a source checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Verify, install, and smoke the downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          asset_directory="$RUNNER_TEMP/release-assets"
          firmware="$FIRMWARE_NAME"
          wheel="$WHEEL_NAME"
          sdist="$SDIST_NAME"
          expected=(
            "$firmware" "$firmware.sha256"
            "$wheel" "$wheel.sha256"
            "$sdist" "$sdist.sha256"
            LICENSE LICENSE.sha256
            THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md.sha256
          )
          mapfile -t actual < <(find "$asset_directory" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual[*]}" == "$(printf '%s\n' "${expected[@]}" | sort | xargs)" ]]
          (
            cd "$asset_directory"
            for sidecar in *.sha256; do
              sha256sum --check --strict "$sidecar"
            done
          )
          python -m zipfile -t "$asset_directory/$wheel"
          python -m tarfile -l "$asset_directory/$sdist" >/dev/null
          wheel_venv="$RUNNER_TEMP/release-wheel"
          python -m venv "$wheel_venv"
          wheel_python="$wheel_venv/bin/python"
          wheel_cli="$wheel_venv/bin/hidbotctl"
          "$wheel_python" -m pip install --disable-pip-version-check --no-input "$asset_directory/$wheel"
          "$wheel_python" -m pip check
          env -u PYTHONPATH "$wheel_python" -c 'import os; from importlib.metadata import version; from pathlib import Path; import hidbot; assert version("s3-hidbot-host") == os.environ["PRODUCT_VERSION"]; assert "site-packages" in Path(hidbot.__file__).parts'
          env -u PYTHONPATH "$wheel_cli" --help >/dev/null
          env -u PYTHONPATH "$wheel_cli" verify-artifact "$asset_directory/$firmware" >/dev/null
          sdist_venv="$RUNNER_TEMP/release-sdist"
          python -m venv "$sdist_venv"
          sdist_python="$sdist_venv/bin/python"
          "$sdist_python" -m pip install --disable-pip-version-check --no-input "$asset_directory/$sdist"
          "$sdist_python" -m pip check
          env -u PYTHONPATH "$sdist_python" -c 'import os; from importlib.metadata import version; import hidbot; assert version("s3-hidbot-host") == os.environ["PRODUCT_VERSION"]; assert "site-packages" in hidbot.__file__'
          flash_venv="$RUNNER_TEMP/release-flash"
          python -m venv "$flash_venv"
          flash_python="$flash_venv/bin/python"
          flash_cli="$flash_venv/bin/hidbotctl"
          "$flash_python" -m pip install --disable-pip-version-check --no-input "$asset_directory/$wheel[flash]"
          "$flash_python" -m pip check
          env -u PYTHONPATH "$flash_python" -m esptool version >/dev/null
          env -u PYTHONPATH "$flash_cli" flash-firmware --help >/dev/null
