name: Non-hardware validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-package-producer:
    name: U6.4A - canonical host wheel producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate canonical host wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input build
          artifact_directory="$RUNNER_TEMP/host-package"
          python tools/build_host_artifact.py "$artifact_directory"
          python tools/test_host_artifact.py "$artifact_directory"
      - name: Upload canonical host wheel
        uses: actions/upload-artifact@v4
        with:
          name: host-package
          path: ${{ runner.temp }}/host-package/*
          if-no-files-found: error
          retention-days: 14

  host-package-consumer:
    name: U6.4A - canonical host wheel consumer (Python ${{ matrix.python-version }})
    needs: host-package-producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download canonical host wheel
        uses: actions/download-artifact@v4
        with:
          name: host-package
          path: ${{ runner.temp }}/host-package
      - name: Verify, install, and smoke canonical host wheel
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/host-package"
          mapfile -t files < <(find "$artifact_directory" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_wheel="s3_hidbot_host-0.1.0-py3-none-any.whl"
          expected_checksum="${expected_wheel}.sha256"
          if [[ "${#files[@]}" -ne 2 || "${files[0]}" != "$expected_wheel" || "${files[1]}" != "$expected_checksum" ]]; then
            echo "downloaded host artifact does not contain exactly wheel plus matching checksum" >&2
            exit 1
          fi
          wheel="$artifact_directory/${files[0]}"
          checksum="$artifact_directory/${files[1]}"
          [[ ! -e "$GITHUB_WORKSPACE/host" ]]
          [[ $(wc -c <"$checksum") -eq $((67 + ${#expected_wheel})) ]]
          grep -Eq '^[0-9a-f]{64}  s3_hidbot_host-0.1.0-py3-none-any\.whl$' "$checksum"
          (
            cd "$artifact_directory"
            sha256sum --check --strict "${files[1]}"
          )
          consumer_directory="$RUNNER_TEMP/host-package-consumer"
          python -m venv "$consumer_directory"
          consumer_python="$consumer_directory/bin/python"
          consumer_cli="$consumer_directory/bin/hidbotctl"
          "$consumer_python" -m pip install --disable-pip-version-check --no-input "$wheel"
          "$consumer_python" -m pip check
          env -u PYTHONPATH "$consumer_python" -c 'from importlib.metadata import version; from pathlib import Path; import hidbot; assert version("s3-hidbot-host") == "0.1.0"; assert "site-packages" in Path(hidbot.__file__).parts'
          env -u PYTHONPATH "$consumer_cli" --help >/dev/null
          set +e
          env -u PYTHONPATH -u S3_HIDBOT_SERIAL -u S3_HIDBOT_BAUD "$consumer_cli" hello >/dev/null 2>&1
          status=$?
          set -e
          [[ "$status" -eq 2 ]]

  host-package:
    name: Tier B - host and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Host clean install, import, CLI, and tests
        run: ./tools/test-host.sh
      - name: Host package wheel and sdist validation
        run: ./tools/test-package.sh

  host-package-flash-consumer:
    name: U6.4B2b - flash extra consumer (Python ${{ matrix.python-version }})
    needs: host-package-producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download canonical host wheel
        uses: actions/download-artifact@v4
        with:
          name: host-package
          path: ${{ runner.temp }}/host-package
      - name: Verify and install flash extra without checkout
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/host-package"
          mapfile -t files < <(find "$artifact_directory" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_wheel="s3_hidbot_host-0.1.0-py3-none-any.whl"
          expected_checksum="${expected_wheel}.sha256"
          if [[ "${#files[@]}" -ne 2 || "${files[0]}" != "$expected_wheel" || "${files[1]}" != "$expected_checksum" ]]; then
            echo "downloaded host artifact does not contain exactly wheel plus matching checksum" >&2
            exit 1
          fi
          wheel="$artifact_directory/${files[0]}"
          (
            cd "$artifact_directory"
            sha256sum --check --strict "${files[1]}"
          )
          [[ ! -e "$GITHUB_WORKSPACE/host" ]]
          consumer_directory="$RUNNER_TEMP/host-package-flash-consumer"
          python -m venv "$consumer_directory"
          consumer_python="$consumer_directory/bin/python"
          consumer_cli="$consumer_directory/bin/hidbotctl"
          "$consumer_python" -m pip install --disable-pip-version-check --no-input "${wheel}[flash]"
          "$consumer_python" -m pip check
          env -u PYTHONPATH "$consumer_python" -c 'from importlib.metadata import version; from pathlib import Path; import hidbot; assert version("s3-hidbot-host") == "0.1.0"; assert "site-packages" in Path(hidbot.__file__).parts'
          env -u PYTHONPATH "$consumer_python" -m esptool version
          env -u PYTHONPATH "$consumer_cli" flash-firmware --help >/dev/null
          env -u PYTHONPATH "$consumer_python" - <<'PY'
          from __future__ import annotations

          from types import SimpleNamespace

          from hidbot.client import HelloResult
          from hidbot.firmware_verification import ArtifactFirmwareIdentity
          from hidbot.flashing import FlashExecutionResult
          from hidbot.provisioning_workflow import run_post_flash_provisioning


          class Clock:
              def __init__(self) -> None:
                  self.value = 0.0

              def __call__(self) -> float:
                  return self.value

              def sleep(self, duration: float) -> None:
                  self.value += duration


          class Transport:
              def __init__(self) -> None:
                  self.opened = False
                  self.closed = False
                  self.noisy = True

              def open(self) -> None:
                  self.opened = True

              def read(self, max_bytes: int, timeout: float) -> bytes:
                  del max_bytes, timeout
                  if self.opened and self.noisy:
                      self.noisy = False
                      return b"\x00boot-noise"
                  return b""

              def close(self) -> None:
                  self.closed = True


          class Client:
              def __init__(self, transport: Transport) -> None:
                  self.transport = transport
                  self.closed = False

              def connect(self) -> HelloResult:
                  return HelloResult(
                      "0123456789abcdef0123456789abcdef",
                      "0123456789abcdef0123456789abcdef",
                      "fedcba9876543210fedcba9876543210",
                      ("firmware.identity-v1",),
                      5000,
                  )

              def info(self) -> object:
                  return {
                      "project": "s3-hidbot",
                      "target": "esp32s3",
                      "idf_version": "v5.5.4",
                      "protocol_version": 1,
                      "firmware": {
                          "version": "0.1.0-dev",
                          "source_revision": "a" * 40,
                          "app_elf_sha256": "b" * 64,
                          "build_profile": "freenove-fnk0085",
                      },
                  }

              def close(self) -> None:
                  self.closed = True
                  self.transport.close()


          identity = ArtifactFirmwareIdentity(
              project="s3-hidbot",
              target="esp32s3",
              protocol_version=1,
              version="0.1.0-dev",
              source_revision="a" * 40,
              app_elf_sha256="b" * 64,
              build_profile="freenove-fnk0085",
              idf_version="v5.5.4",
          )
          clock = Clock()
          transport = Transport()
          flash_calls: list[object] = []

          def flash(bundle: object, port: str, **kwargs: object) -> FlashExecutionResult:
              del bundle, port, kwargs
              flash_calls.append("flash")
              return FlashExecutionResult(attempts=1, chip="esp32s3", image_count=3)

          result = run_post_flash_provisioning(
              SimpleNamespace(artifact_identity=identity),
              "no-device",
              flash_executor=flash,
              transport_factory=lambda *args, **kwargs: transport,
              client_factory=lambda opened, timeout, attempts: Client(opened),
              clock=clock,
              sleeper=clock.sleep,
          )
          assert result.ok
          assert len(flash_calls) == 1
          assert transport.closed
          print("PASS: installed post-flash provisioning orchestration smoke")
          PY
          set +e
          env -u PYTHONPATH -u S3_HIDBOT_SERIAL -u S3_HIDBOT_BAUD \
            "$consumer_cli" --port no-device flash-firmware "$RUNNER_TEMP/missing-artifact" \
            >"$RUNNER_TEMP/flash-extra-smoke.log" 2>&1
          status=$?
          set -e
          [[ "$status" -eq 2 ]]

  native:
    name: Tier B - IDF-independent native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: IDF-independent native C++ tests
        run: ./tools/test-native.sh

  firmware:
    name: Tier C - ESP-IDF firmware
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: IDF-dependent native protocol tests
        run: ./tools/test-control-protocol.sh
      - name: ESP-IDF v5.5.4 esp32s3 firmware build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          ./tools/test-firmware.sh
